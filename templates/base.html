
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PhysioFlex" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/physioflex-180.png" />

  <title>{% block title %}PhysioFlex – Hospital & Clinical Rehabilitation{% endblock %}</title>

  <link rel="icon" href="data:image/svg+xml,*<*&#x73;vg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22>*<*&#x74;ext y=%22.9em%22 font-size=%2290%22>✚*<*/text>*<*/svg>">

  <style>
    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    button, input, select, textarea {
      touch-action: manipulation;
    }

    @media (max-width: 640px) {
      .grid.grid-cols-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      }

      .max-w-4xl, .max-w-5xl, .max-w-6xl {
        max-width: 100% !important;
      }

      input, select, textarea {
        font-size: 16px !important;
      }
    }
  </style>

              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f'
            },
            rehab: {

              100: '#ede9fe',

            card: '0 2px 14px -2px rgba(15, 23, 42, 0.05), 0 0 0 1px rgba(13, 148, 136, 0.06)',
            'card-hover': '0 12px 30px -4px rgba(13, 148, 136, 0.12), 0 0 0 1px rgba(13, 148, 136, 0.15)',
            glow: '0 0 25px -4px rgba(20, 184, 166, 0.35)',

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: radial-gradient(circle at 10% 20%, rgba(204, 251, 241, 0.35) 0%, rgba(240, 253, 250, 0.2) 40%, rgba(241, 245, 249, 0.8) 100%), #f8fafc;
      min-height: 100vh;
    }

    .font-display {
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
    }

    .card {
      background: #ffffff;
      border-radius: 1.25rem;
      border: 1px solid rgba(204, 251, 241, 0.9);
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 0 0 1px rgba(13, 148, 136, 0.06);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover {
      box-shadow: 0 10px 25px -4px rgba(13, 148, 136, 0.08), 0 0 0 1px rgba(13, 148, 136, 0.12);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.625rem 1.35rem;
      background: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
      color: #ffffff;
      border-radius: 0.875rem;
      font-size: 0.875rem;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.3);
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0f766e 0%, #0369a1 100%);
      box-shadow: 0 6px 20px rgba(13, 148, 136, 0.4);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.625rem 1.35rem;
      background: #ffffff;
      color: #0f766e;
      border: 1.5px solid #ccfbf1;
      border-radius: 0.875rem;
      font-size: 0.875rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-secondary:hover {
      background: #f0fdfa;
      border-color: #5eead4;
      color: #115e59;
      transform: translateY(-1px);
    }

    .btn-emerald {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.625rem 1.35rem;
      background: linear-gradient(135deg, #10b981 0%, #0d9488 100%);
      color: #ffffff;
      border-radius: 0.875rem;
      font-size: 0.875rem;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
    }

    .btn-emerald:hover {
      background: linear-gradient(135deg, #059669 0%, #0f766e 100%);
      transform: translateY(-1px);
    }

    .btn-rose {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.625rem 1.35rem;
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      color: #ffffff;
      border-radius: 0.875rem;
      font-size: 0.875rem;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.3);
      transition: all 0.2s ease;
    }

    .btn-rose:hover {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      transform: translateY(-1px);
    }

    .input {
      width: 100%;
      padding: 0.65rem 0.95rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 0.875rem;
      font-size: 0.875rem;
      background: #ffffff;
      transition: all 0.2s ease;
      outline: none;
    }

    .input:focus {
      border-color: #14b8a6;
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
    }

    .glass {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid rgba(204, 251, 241, 0.7);
    }

    /* Medical cross animation & accents */
    .med-pulse {
      animation: medPulse 2.5s infinite;
    }

    @keyframes medPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.05);
        opacity: 0.85;
      }
    }

    /* Custom smooth scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Multilingual support */
    #language-selector {
      min-width: 150px;
      max-width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccfbf1;
      border-radius: 10px;
      background: white;
      color: #0f766e;
      font-weight: 600;
      cursor: pointer;
    }

    #language-toolbar {
      position: relative;
      z-index: 40;
    }

    html[dir="rtl"] {
      direction: rtl;
    }

    html[dir="rtl"] input,
    html[dir="rtl"] textarea {
      text-align: right;
    }

    .multilingual-font {
      font-family: system-ui, sans-serif;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  {% block head %}{% endblock %}

  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () =>
        navigator.serviceWorker.register('/service-worker.js')
          .catch(err => console.warn('PWA service worker registration failed', err))
      );
    }
  </script>
</head>

<body class="text-slate-900 min-h-screen antialiased flex flex-col selection:bg-teal-100 selection:text-teal-900">

  {% block body %}{% endblock %}

  <script src="/static/js/api.js"></script>
  <script src="/static/js/language.js"></script>

  {% block scripts %}{% endblock %}

</body>
</html>
